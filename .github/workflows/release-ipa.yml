name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build iPhone and iPad release
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Paperly.xcodeproj \
            -scheme Paperly \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PaperlyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/PaperlyIPA/Payload"
          cp -R \
            "$RUNNER_TEMP/PaperlyDerivedData/Build/Products/Release-iphoneos/Paperly.app" \
            "$RUNNER_TEMP/PaperlyIPA/Payload/Paperly.app"
          cd "$RUNNER_TEMP/PaperlyIPA"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Paperly-unsigned.ipa" Payload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paperly-unsigned
          path: Paperly-unsigned.ipa
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Paperly-unsigned.ipa --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              Paperly-unsigned.ipa \
              --title "Paperly $GITHUB_REF_NAME" \
              --generate-notes
          fi
