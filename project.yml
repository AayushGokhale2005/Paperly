name: Paperly
options:
  bundleIdPrefix: app.paperly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: YES
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 0.18.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0
targets:
  Paperly:
    type: application
    platform: iOS
    sources: [Paperly]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: GRDB
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: WhisperKit
        product: WhisperKit
      - target: PaperlyWidgets
        destinationFilters: [iOS]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.paperly.ipad
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Paperly/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8VF64B3YX
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Paperly/Resources/PaperlyMac.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Paperly/Resources/Info.plist
      properties:
        CFBundleDisplayName: Paperly
        NSMicrophoneUsageDescription: Paperly records audio you choose to transcribe locally on this device.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
          - CFBundleURLName: app.paperly.shortcuts
            CFBundleURLSchemes: [paperly]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.paperly.notebook
            UTTypeDescription: Paperly Notebook
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [paperly]
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            LSItemContentTypes: [com.adobe.pdf]
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
          - CFBundleTypeName: Paperly Notebook
            LSItemContentTypes: [app.paperly.notebook]
            CFBundleTypeRole: Editor
  PaperlyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PaperlyWidgets
      - Paperly/Models/AudioNoteActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.paperly.ipad.widgets
        PRODUCT_NAME: PaperlyWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PaperlyWidgets/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8VF64B3YX
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: PaperlyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Paperly Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PaperlyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PaperlyTests]
    dependencies:
      - target: Paperly
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8VF64B3YX
schemes:
  Paperly:
    build:
      targets:
        Paperly: all
    test:
      targets: [PaperlyTests]
